name: ApisnixPhone Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apisnixphone-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout APISNIX build sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Python for source preparation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Prepare the locked Linphone Desktop source
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          python scripts/prepare-sources.py desktop
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed.' }

      - name: Install Qt for Visual Studio 2022
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtnetworkauth qtshadertools'
          cache: true

      - name: Install MSYS2 SDK build dependencies
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git patch diffutils make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-pystache
            mingw-w64-x86_64-python-six
            mingw-w64-x86_64-doxygen
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-graphviz
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkgconf
            perl intltool

      - name: Build and package Windows x64
        env:
          APISNIX_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYSTEM: MINGW64
          MINGW_PACKAGE_PREFIX: mingw-w64-x86_64
        run: |
          $env:PATH = "$env:APISNIX_MSYS_ROOT\mingw64\bin;$env:APISNIX_MSYS_ROOT;$env:APISNIX_MSYS_ROOT\usr\bin;C:\Program Files\7-Zip;$env:PATH"
          ./scripts/build-windows.ps1 -QtRoot $env:QT_ROOT_DIR -Jobs 2

      - name: Check installer and write checksum
        run: |
          $files = @(Get-ChildItem dist/windows/ApisnixPhone*.exe)
          if ($files.Count -eq 0) { throw 'No installer was produced.' }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content dist/windows/SHA256SUMS -Encoding utf8

      - name: Save the test installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ApisnixPhone-Windows-x64-test
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
